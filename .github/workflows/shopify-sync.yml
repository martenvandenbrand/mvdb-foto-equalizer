name: Shopify Aroma Sync

on:
  workflow_dispatch:  # Manual trigger via GitHub UI
    inputs:
      dry_run:
        description: 'Dry run (preview without updating)?'
        required: false
        default: 'false'

jobs:
  sync-aromas:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run Shopify Aroma Sync
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - << 'PYTHON_EOF'
          import json
          import requests
          import os
          from datetime import datetime
          
          # Configuration
          TOKEN = os.getenv('SHOPIFY_ACCESS_TOKEN')
          STORE = os.getenv('SHOPIFY_STORE', 'koperenkaraf.myshopify.com')
          DRY_RUN = os.getenv('DRY_RUN', 'false').lower() == 'true'
          API_VERSION = '2024-01'
          
          if not TOKEN:
              print("❌ ERROR: SHOPIFY_ACCESS_TOKEN secret not set")
              exit(1)
          
          API_URL = f'https://{STORE}/admin/api/{API_VERSION}/graphql.json'
          HEADERS = {
              'X-Shopify-Access-Token': TOKEN,
              'Content-Type': 'application/json'
          }
          
          # Load flavor data
          print("📋 Loading flavor_meta.json...")
          with open('flavor_meta.json', 'r', encoding='utf-8') as f:
              flavor_data = json.load(f)
          
          print(f"✅ Loaded {len(flavor_data)} products\n")
          
          # Prepare aroma map (merge primary + secondary)
          aroma_map = {}
          for handle, aromas in flavor_data.items():
              primary = aromas.get('primair', [])
              secondary = aromas.get('secundair', [])
              all_aromas = primary + secondary
              
              # Remove duplicates
              seen_names = set()
              unique_aromas = []
              for aroma in all_aromas:
                  if aroma['naam'] not in seen_names:
                      unique_aromas.append(aroma)
                      seen_names.add(aroma['naam'])
              
              aroma_map[handle] = unique_aromas
          
          def graphql_query(query, variables=None):
              """Execute GraphQL query"""
              payload = {'query': query}
              if variables:
                  payload['variables'] = variables
              
              response = requests.post(API_URL, json=payload, headers=HEADERS)
              data = response.json()
              
              if 'errors' in data:
                  return None, data['errors']
              
              return data.get('data'), None
          
          def find_product_by_handle(handle):
              """Find product ID by handle"""
              query = '''
              query($query: String!) {
                products(first: 1, query: $query) {
                  edges {
                    node {
                      id
                      handle
                      title
                    }
                  }
                }
              }
              '''
              
              data, errors = graphql_query(query, {'query': f'handle:{handle}'})
              if errors:
                  return None, None, errors
              
              products = data.get('products', {}).get('edges', [])
              if products:
                  node = products[0]['node']
                  return node['id'], node['title'], None
              
              return None, None, None
          
          def set_aromas(product_id, aromas):
              """Set aromas metafield"""
              aromas_json = json.dumps(aromas, ensure_ascii=False)
              aromas_json_escaped = aromas_json.replace('\\', '\\\\').replace('"', '\\"')
              
              mutation = f'''
              mutation {{
                metafieldsSet(
                  metafields: [
                    {{
                      ownerId: "{product_id}"
                      namespace: "wine_profile"
                      key: "aromas"
                      type: "json"
                      value: "{aromas_json_escaped}"
                    }}
                  ]
                ) {{
                  metafields {{
                    id
                    key
                  }}
                  userErrors {{
                    field
                    message
                  }}
                }}
              }}
              '''
              
              if DRY_RUN:
                  return True, None
              
              data, errors = graphql_query(mutation)
              if errors:
                  return False, errors[0]['message'] if errors else 'Unknown error'
              
              user_errors = data.get('metafieldsSet', {}).get('userErrors', [])
              if user_errors:
                  return False, user_errors[0]['message']
              
              return True, None
          
          # Execute sync
          print(f"🚀 Starting Shopify Aroma Sync")
          if DRY_RUN:
              print("   (DRY RUN - no updates will be made)\n")
          else:
              print()
          
          successful = 0
          failed = 0
          not_found = 0
          errors_log = []
          
          handles = list(aroma_map.keys())
          total = len(handles)
          
          for i, handle in enumerate(handles, 1):
              # Progress indicator
              if i % 20 == 0:
                  progress = (i / total) * 100
                  print(f"\n[Progress: {progress:.0f}% - {i}/{total}]\n", end='')
              
              print(f"[{i:3d}/{total}] {handle[:45]:45} ... ", end='', flush=True)
              
              # Find product
              product_id, product_title, errors = find_product_by_handle(handle)
              
              if not product_id:
                  print("❌ Not found")
                  not_found += 1
                  if errors:
                      errors_log.append(f"{handle}: {errors}")
                  continue
              
              # Set aromas
              aromas = aroma_map[handle]
              success, error = set_aromas(product_id, aromas)
              
              if success:
                  print(f"✅ ({len(aromas)} aromas)")
                  successful += 1
              else:
                  print(f"❌ {error}")
                  failed += 1
                  errors_log.append(f"{handle}: {error}")
          
          # Summary
          print(f"\n{'='*70}")
          print(f"SYNC COMPLETE - {datetime.now().isoformat()}")
          print(f"{'='*70}")
          print(f"\n📊 Results:")
          print(f"  ✅ Successful: {successful}/{total}")
          print(f"  ❌ Failed: {failed}/{total}")
          print(f"  ⏭️  Not found: {not_found}/{total}")
          
          if DRY_RUN:
              print(f"\n⚠️  DRY RUN MODE - No actual updates were made")
          
          if errors_log:
              print(f"\n⚠️  Errors:")
              for error in errors_log[:5]:
                  print(f"  - {error}")
              if len(errors_log) > 5:
                  print(f"  ... and {len(errors_log) - 5} more")
          
          # Exit with appropriate code
          exit(0 if failed == 0 else 1)
          PYTHON_EOF
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sync-results
          path: |
            flavor_meta.json
            .github/workflows/shopify-sync.yml
      
      - name: Create summary
        if: always()
        run: |
          echo "## Shopify Aroma Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Migration completed" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
